[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphrag-atlas"
version = "0.1.0"
description = "Production-grade Hybrid GraphRAG in a single MongoDB Atlas cluster"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Mabasha.R", email = "mabasham52@gmail.com" }
]
keywords = [
    "mongodb",
    "atlas",
    "graphrag",
    "knowledge-graph",
    "vector-search",
    "rag",
    "hybrid-search",
    "llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database"
]
dependencies = [
    "pydantic>=2.7.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    "dnspython>=2.6.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "networkx>=3.0"
]

[project.optional-dependencies]
openai = [
    "openai>=1.30.0"
]
aws = [
    "boto3>=1.34.0"
]
cohere = [
    "cohere>=5.5.0"
]
parsers = [
    "markitdown[all]>=0.0.1a4"
]
all = [
    "openai>=1.30.0",
    "boto3>=1.34.0",
    "cohere>=5.5.0",
    "markitdown[all]>=0.0.1a4"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/graphrag-atlas/graphrag-atlas"
Documentation = "https://github.com/graphrag-atlas/graphrag-atlas#readme"
Repository = "https://github.com/graphrag-atlas/graphrag-atlas"

[tool.hatch.build.targets.wheel]
packages = ["graphrag_atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
