[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphrag-atlas"
version = "0.1.0"
description = "Production-grade Single-Store Hybrid GraphRAG on MongoDB Atlas: BM25, HNSW Vector Search, and Bounded $graphLookup"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Mabasha.R", email = "mabasham52@gmail.com" }
]
keywords = [
    "graphrag",
    "rag",
    "knowledge-graph",
    "mongodb",
    "mongodb-atlas",
    "hybrid-search",
    "vector-search",
    "bm25",
    "reciprocal-rank-fusion",
    "rrf",
    "reranker",
    "semantic-search",
    "information-retrieval",
    "llm",
    "genai",
    "graph-lookup",
    "leiden-clustering",
    "langchain",
    "llamaindex",
    "ai-agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search"
]
dependencies = [
    "pydantic>=2.7.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    "dnspython>=2.6.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "networkx>=3.0"
]

[project.optional-dependencies]
openai = [
    "openai>=1.30.0"
]
aws = [
    "boto3>=1.34.0"
]
cohere = [
    "cohere>=5.5.0"
]
parsers = [
    "markitdown[all]>=0.0.1a4"
]
all = [
    "openai>=1.30.0",
    "boto3>=1.34.0",
    "cohere>=5.5.0",
    "markitdown[all]>=0.0.1a4"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/R-Mabasha/graphrag-atlas"
Documentation = "https://github.com/R-Mabasha/graphrag-atlas#readme"
Repository = "https://github.com/R-Mabasha/graphrag-atlas"
Issues = "https://github.com/R-Mabasha/graphrag-atlas/issues"

[tool.hatch.build.targets.wheel]
packages = ["graphrag_atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
